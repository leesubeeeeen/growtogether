name: growtogether
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  table_calendar: ^3.0.9
  http: 1.1.0
  provider: ^6.1.1
  flutter_dotenv: ^5.0.2
  firebase_core: 4.1.0
  cloud_firestore: 6.0.1
  firebase_auth: 6.0.2

flutter_intl:
  enabled: true

dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

  fonts:
    - family: BMJUA
      fonts:
        - asset: assets/fonts/BMJUA_ttf.ttf
          weight: 400

  assets:
    - assets/images/