name: growtogether
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  table_calendar: ^3.0.9
  http: ^0.13.5
  provider: ^6.1.1
  flutter_dotenv: ^5.0.2
  firebase_core: ^2.25.4
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.15.4


flutter_intl:
  enabled: true

dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  fonts:
    - family: BMJUA
      fonts:
          - asset: assets/fonts/BMJUA_ttf.ttf
  uses-material-design: true
  assets:
    - assets/images/