name: growtogether
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  table_calendar: ^3.0.9
  http: ^1.2.2 # ← 최신화
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1





flutter_intl:
  enabled: true

dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  fonts:
    - family: BMJUA
      fonts:
          - asset: assets/fonts/BMJUA_ttf.ttf
  uses-material-design: true
  assets:
    - assets/images/
    - .env